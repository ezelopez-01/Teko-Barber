
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Teko Barber - Fidelidad</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#111;color:#fff;
 font-family:Arial,sans-serif;display:flex;
 justify-content:center;align-items:center;padding:20px
}
.tarjeta{
 width:100%;max-width:420px;background:#1c1c1c;
 border:1px solid #b99a62;border-radius:20px;
 padding:28px 20px;text-align:center
}
h1{color:#c9aa70;letter-spacing:4px}
.sub{color:#bbb;font-size:12px;letter-spacing:2px}
h2{color:#c9aa70;margin-top:35px}
.visitas{
 display:grid;grid-template-columns:repeat(5,1fr);
 gap:9px;margin:25px 0
}
.sello{
 border:1px solid #c9aa70;border-radius:50%;
 width:100%;aspect-ratio:1;display:flex;
 align-items:center;justify-content:center;
 color:#c9aa70;font-size:20px
}
.completo{background:#c9aa70;color:#111}
button{
 width:100%;padding:15px;border:0;border-radius:10px;
 background:#c9aa70;color:#111;font-size:16px;
 font-weight:bold;margin-top:12px
}
button:disabled{opacity:.5}
.nota{font-size:12px;color:#aaa;margin-top:20px}
</style>
</head>
<body>
<main class="tarjeta">
<h1>TEKO BARBER</h1>
<div class="sub">TARJETA DE FIDELIDAD</div>
<h2>TUS VISITAS</h2>
<div class="visitas" id="visitas"></div>
<p id="estado">Completá tus 5 visitas</p>
<h2>PREMIO</h2>
<p>UN CORTE GRATIS</p>
<button id="visitar">Registrar primera visita</button>
<p class="nota">Tu fidelidad tiene recompensa.</p>
</main>
<script>
const clave="teko_barber_visitas";
let cantidad=Number(localStorage.getItem(clave)||0);
const contenedor=document.getElementById("visitas");
const boton=document.getElementById("visitar");
const estado=document.getElementById("estado");

function actualizar(){
 contenedor.innerHTML="";
 for(let i=1;i<=5;i++){
  const sello=document.createElement("div");
  sello.className="sello"+(i<=cantidad?" completo":"");
  sello.textContent=i<=cantidad?"✓":i;
  contenedor.appendChild(sello);
 }
 estado.textContent=cantidad>=5?
 "¡Felicidades! ¡Ganaste un corte gratis!":
 "Llevás "+cantidad+" de 5 visitas";
 boton.textContent=cantidad===0?"Registrar primera visita":
 "Registrar siguiente visita";
 boton.disabled=cantidad>=5;
}
boton.addEventListener("click",()=>{
 if(cantidad<5){
  cantidad++;
  localStorage.setItem(clave,cantidad);
  actualizar();
 }
});
actualizar();
</script>
</body>
</html>
